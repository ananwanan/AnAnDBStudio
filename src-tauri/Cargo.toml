[package]
name = "anandbstudio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
# The library name must differ from the binary name on Windows.
name = "anandbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anandb-driver-sqlite = { path = "../crates/anandb-driver-sqlite" }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
